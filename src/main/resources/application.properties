# 礼品礼盒退货系统 —— Quarkus + SQLite
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.limits.max-body-size=20M

# SQLite：Quarkus 无官方扩展，按 other 接入 Xerial 驱动
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:${GIFTBOX_DB_PATH:data/giftbox.db}?busy_timeout=15000
# SQLite 仅支持单写者；连接池收敛为 1，并发退货在连接层排队后由“条件认领”仲裁
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.min-size=0

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# 照片本地保存目录
giftbox.storage.photo-dir=${GIFTBOX_PHOTO_DIR:data/photos}

%test.quarkus.datasource.jdbc.url=jdbc:sqlite:file:target/test-return.db?busy_timeout=15000
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.giftbox.storage.photo-dir=target/test-photos
%test.quarkus.http.test-port=8080
