# ---- Datasource: SQLite via xerial JDBC ----
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:./data/giftbox.db
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000
quarkus.datasource.jdbc.additional-jdbc-properties.foreign_keys=true
quarkus.datasource.jdbc.additional-jdbc-properties.journal_mode=WAL
# 写事务开始时即取写锁：并发写串行化，避免 WAL 下的 BUSY_SNAPSHOT
quarkus.datasource.jdbc.additional-jdbc-properties.transaction_mode=IMMEDIATE

# ---- Hibernate ----
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.limits.max-body-size=20M

# ---- App ----
giftbox.photos.dir=./data/photos

# ---- Test profile ----
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:./target/test.db
%test.quarkus.datasource.jdbc.max-size=4
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.giftbox.photos.dir=./target/test-data/photos
